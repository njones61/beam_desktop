<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beam Designer</title>
<style>
:root {
  --navy: #1f3a5f; --blue: #2f6fb3; --bg: #f3f5f8; --card: #ffffff; --line: #dfe4ea;
  --text: #1d2733; --muted: #64707d; --dead: #5b6b82; --live: #e0832a;
  --ok: #2e9e5b; --warn: #d99a1a; --bad: #d6453d;
  --cV: #178a8a; --cM: #2f6fb3; --cD: #7e57c2;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.topbar { background: var(--navy); color: #fff; padding: 14px 24px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.topbar h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: .2px; }
.topbar .sub { color: #b9c8dc; font-size: 13px; }
.layout { display: grid; grid-template-columns: 350px minmax(0, 1fr); gap: 20px; padding: 20px 24px; max-width: 1400px; margin: 0 auto; align-items: start; }
@media (max-width: 920px) { .layout { grid-template-columns: 1fr; padding: 14px; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; box-shadow: 0 1px 2px rgba(20,35,55,.05); }
.card + .card { margin-top: 16px; }
h2 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 650; }
h2:not(:first-child) { margin-top: 20px; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.field label, .lhead span { font-size: 12px; color: var(--muted); font-weight: 600; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
input, select { font: inherit; padding: 7px 9px; border: 1px solid #c5ccd6; border-radius: 6px; background: #fff; color: var(--text); width: 100%; min-width: 0; }
input:focus, select:focus, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; border-color: var(--blue); }
input[readonly] { background: #f0f3f7; color: var(--muted); }
.check { flex-direction: row; align-items: center; gap: 8px; }
.check input { width: auto; }
.check label { font-size: 13px; color: var(--text); font-weight: 500; }
.section-fig { background: #f6f8fb; border: 1px solid var(--line); border-radius: 8px; padding: 6px; margin: 2px 0 8px; text-align: center; }
.section-fig svg { width: 100%; max-width: 300px; height: auto; display: block; margin: 0 auto; }
.props { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px 10px; background: #f6f8fb; border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin: 2px 0 10px; }
.props div { font-size: 11px; color: var(--muted); } .props b { display: block; font-size: 13px; color: var(--text); font-weight: 600; }
.lhead, .lrow { display: grid; gap: 6px; align-items: center; }
.lhead { margin-bottom: 4px; }
.lrow { margin-bottom: 6px; }
.pts .lhead, .pts .lrow { grid-template-columns: 1fr 1fr 82px 30px; }
.uni .lhead, .uni .lrow { grid-template-columns: 1fr 1fr 1fr 82px 30px; }
.lrow input, .lrow select { padding: 6px 7px; }
button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid #c5ccd6; background: #fff; color: var(--text); padding: 7px 12px; }
button:hover { background: #f0f4f9; }
button.icon { padding: 4px 0; width: 30px; height: 30px; color: var(--muted); font-size: 16px; line-height: 1; }
button.icon:hover { color: var(--bad); border-color: var(--bad); }
button.add { width: 100%; border-style: dashed; color: var(--blue); }
button.reset { margin-top: 18px; width: 100%; }
.empty { color: var(--muted); font-size: 12px; margin: 0 0 6px; }
.errors { background: #fdf0ef; border: 1px solid #f0c4c0; color: #8c2a24; border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; }
.errors ul { margin: 6px 0 0; padding-left: 20px; }
.verdict { border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; font-weight: 600; display: flex; gap: 10px; align-items: center; }
.verdict.pass { background: #e8f6ee; border: 1px solid #b9e2c9; color: #1f6f40; }
.verdict.fail { background: #fdf0ef; border: 1px solid #f0c4c0; color: #8c2a24; }
.chart-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.readout { font-size: 13px; min-height: 20px; color: var(--muted); font-variant-numeric: tabular-nums; }
.readout b { color: var(--text); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
#chart { width: 100%; touch-action: pan-y; }
#chart svg { display: block; max-width: 100%; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 16px; }
.cards .card + .card { margin-top: 0; }
.stat .k { font-size: 12px; color: var(--muted); font-weight: 600; }
.stat .v { font-size: 20px; font-weight: 650; margin: 2px 0; font-variant-numeric: tabular-nums; }
.stat .n { font-size: 12px; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td .f { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.bar { height: 8px; background: #e9edf2; border-radius: 4px; overflow: hidden; min-width: 70px; }
.bar span { display: block; height: 100%; border-radius: 4px; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #fff; }
.badge.pass { background: var(--ok); } .badge.fail { background: var(--bad); }
.table-wrap { overflow-x: auto; }
.notes { font-size: 12.5px; color: var(--muted); } .notes ul { margin: 6px 0 0; padding-left: 18px; } .notes li { margin: 3px 0; }
.placeholder { color: var(--muted); padding: 40px 10px; text-align: center; }
</style>
</head>
<body>
<header class="topbar">
  <h1>Beam Designer</h1>
  <span class="sub">Shear, moment and deflection &middot; steel W-shapes &middot; ASD</span>
</header>

<main class="layout">
  <section class="card" aria-label="Inputs">
    <h2>Beam</h2>
    <div class="field">
      <label for="support">Support</label>
      <select id="support">
        <option value="simple">Simply supported</option>
        <option value="cantilever">Cantilever (fixed at left end)</option>
      </select>
    </div>
    <div class="field">
      <label for="span">Span (ft)</label>
      <input id="span" type="number" step="any" min="0">
    </div>

    <h2>Section</h2>
    <div class="field">
      <label for="shape">Steel W-shape</label>
      <select id="shape"></select>
    </div>
    <div class="section-fig" id="section"></div>
    <div class="props" id="props"></div>
    <div class="row2">
      <div class="field">
        <label for="grade">Steel grade</label>
        <select id="grade">
          <option value="A992">A992</option>
          <option value="A36">A36</option>
          <option value="custom">Custom Fy</option>
        </select>
      </div>
      <div class="field">
        <label for="fy">Fy (ksi)</label>
        <input id="fy" type="number" step="any" min="0">
      </div>
    </div>

    <h2>Point loads</h2>
    <div class="pts" id="points"></div>
    <button class="add" id="addPoint" type="button">+ Add point load</button>

    <h2>Uniform loads</h2>
    <div class="uni" id="uniforms"></div>
    <button class="add" id="addUniform" type="button">+ Add uniform load</button>

    <h2>Options</h2>
    <div class="field check">
      <input id="selfw" type="checkbox">
      <label for="selfw">Include beam self-weight (dead)</label>
    </div>
    <div class="field">
      <label for="limit">Live-load deflection limit L /</label>
      <input id="limit" type="number" step="any" min="1">
    </div>
    <button class="reset" id="reset" type="button">Reset to example</button>
  </section>

  <section aria-label="Results">
    <div id="messages"></div>
    <div id="results">
      <div class="card">
        <div class="chart-head">
          <div class="readout" id="readout"></div>
          <div class="legend">
            <span><i style="background:var(--dead)"></i>Dead load</span>
            <span><i style="background:var(--live)"></i>Live load</span>
          </div>
        </div>
        <div id="chart"></div>
      </div>
      <div class="cards" id="summary"></div>
      <div class="card"><h2>Checks</h2><div class="table-wrap" id="checks"></div></div>
      <div class="card notes" id="notes"></div>
    </div>
  </section>
</main>

// ==== CORE START (pure calculation, no DOM) ====
const E_STEEL = 29000; // ksi
const GRADES = { A992: 50, A36: 36 };
const TOL = 1e-9;

function parseShapes(csv) {
  const lines = csv.trim().split('\n').slice(1);
  return lines.map(line => {
    const c = line.split(',');
    return { name: c[0], w: +c[1], A: +c[2], d: +c[3], bf: +c[4], tw: +c[5], tf: +c[6], Ix: +c[7], Sx: +c[8], Zx: +c[9] };
  });
}

const br = (x, a) => (x > a ? x - a : 0);

// Loads: points [{x ft, P kip}], uniforms [{a ft, b ft, w kip/ft}]. All act downward.
// Sign: V up on the left face is positive, M sagging is positive, deflection is positive downward.
function analyze(support, L, points, uniforms) {
  const simple = support === 'simple';
  let total = 0, mom = 0;
  for (const p of points) { total += p.P; mom += p.P * p.x; }
  for (const u of uniforms) { const W = u.w * (u.b - u.a); total += W; mom += W * (u.a + u.b) / 2; }
  const RB = simple ? mom / L : 0;
  const RA = total - RB;
  const M0 = simple ? 0 : -mom;

  function V(x, side) {
    const st = a => (side < 0 ? x > a : x >= a);
    let v = 0;
    if (st(0)) v += RA;
    if (simple && st(L)) v += RB;
    for (const p of points) if (st(p.x)) v -= p.P;
    for (const u of uniforms) v -= u.w * Math.max(0, Math.min(x, u.b) - u.a);
    return v;
  }
  function M(x) {
    let m = M0 + RA * x;
    for (const p of points) m -= p.P * br(x, p.x);
    for (const u of uniforms) m -= (u.w / 2) * (br(x, u.a) ** 2 - br(x, u.b) ** 2);
    return m;
  }
  // E*I*y(x) before the C1 term, in kip-ft^3 (y positive upward)
  function EIy0(x) {
    let s = M0 * x * x / 2 + RA * x ** 3 / 6;
    for (const p of points) s -= p.P * br(x, p.x) ** 3 / 6;
    for (const u of uniforms) s -= (u.w / 24) * (br(x, u.a) ** 4 - br(x, u.b) ** 4);
    return s;
  }
  const C1 = simple ? -EIy0(L) / L : 0;
  const defl = (x, E, I) => -(EIy0(x) + C1 * x) * 1728 / (E * I); // inches, down positive

  // Breakpoints: ends, load positions, and exact zero-shear locations (V is linear between loads)
  let xs = [0, L];
  for (const p of points) xs.push(p.x);
  for (const u of uniforms) xs.push(u.a, u.b);
  xs = uniq(xs);
  const zeros = [];
  for (let i = 0; i < xs.length - 1; i++) {
    const v0 = V(xs[i], 1), v1 = V(xs[i + 1], -1);
    if (v0 * v1 < 0) zeros.push(xs[i] + (xs[i + 1] - xs[i]) * v0 / (v0 - v1));
  }
  const keyX = uniq(xs.concat(zeros));

  let vmax = { v: 0, x: 0 };
  for (const x of keyX) for (const s of [-1, 1]) {
    const v = V(x, s);
    if (Math.abs(v) > Math.abs(vmax.v) + TOL) vmax = { v, x };
  }
  let mmax = { v: 0, x: 0 };
  for (const x of keyX) {
    const m = M(x);
    if (Math.abs(m) > Math.abs(mmax.v) + TOL) mmax = { v: m, x };
  }

  function maxDefl(E, I) {
    const N = 800;
    let best = 0, bi = 0;
    for (let i = 0; i <= N; i++) {
      const d = Math.abs(defl(L * i / N, E, I));
      if (d > best) { best = d; bi = i; }
    }
    let lo = L * Math.max(0, bi - 1) / N, hi = L * Math.min(N, bi + 1) / N;
    for (let k = 0; k < 60; k++) {
      const m1 = lo + (hi - lo) / 3, m2 = hi - (hi - lo) / 3;
      if (Math.abs(defl(m1, E, I)) < Math.abs(defl(m2, E, I))) lo = m1; else hi = m2;
    }
    const x = (lo + hi) / 2, d = Math.abs(defl(x, E, I));
    return d > best ? { v: d, x } : { v: best, x: L * bi / N };
  }

  // Sample points for plotting; shear gets two points at each jump
  function series(E, I, n = 240) {
    const grid = [];
    for (let i = 0; i <= n; i++) grid.push(L * i / n);
    const X = uniq(keyX.concat(grid));
    const sv = { x: [], y: [] };
    for (const x of X) {
      const a = V(x, -1), b = V(x, 1);
      sv.x.push(x); sv.y.push(a);
      if (Math.abs(a - b) > 1e-12) { sv.x.push(x); sv.y.push(b); }
    }
    return { X, V: sv, M: X.map(M), D: X.map(x => defl(x, E, I)) };
  }

  return { RA, RB, M0, total, V, M, defl, vmax, mmax, maxDefl, series };
}

function uniq(arr) {
  const s = arr.slice().sort((a, b) => a - b), out = [];
  for (const x of s) if (!out.length || x - out[out.length - 1] > TOL) out.push(x);
  return out;
}

function validate(st) {
  const e = [];
  const num = (v, name) => { if (!Number.isFinite(v)) { e.push(name + ' is not a number.'); return false; } return true; };
  const L = st.span;
  const okL = num(L, 'Span') && (L > 0 || (e.push('Span must be greater than 0.'), false));
  if (okL && L > 500) e.push('Span is unreasonably long (limit 500 ft).');
  if (!SHAPES.find(s => s.name === st.shape)) e.push('Choose a section.');
  if (num(st.fy, 'Fy') && st.fy <= 0) e.push('Fy must be greater than 0.');
  if (num(st.limitDen, 'Deflection limit') && st.limitDen <= 0) e.push('Deflection limit must be greater than 0.');
  st.points.forEach((p, i) => {
    const n = 'Point load ' + (i + 1);
    const a = num(p.x, n + ' position'), b = num(p.P, n + ' magnitude');
    if (b && p.P < 0) e.push(n + ': magnitude must be 0 or more (loads act downward).');
    if (a && okL && (p.x < 0 || p.x > L)) e.push(n + ': position must be between 0 and the span.');
  });
  st.uniforms.forEach((u, i) => {
    const n = 'Uniform load ' + (i + 1);
    const a = num(u.a, n + ' start'), b = num(u.b, n + ' end'), c = num(u.w, n + ' magnitude');
    if (c && u.w < 0) e.push(n + ': magnitude must be 0 or more (loads act downward).');
    if (a && b && !(u.b > u.a)) e.push(n + ': end must be greater than start.');
    if (a && okL && u.a < 0) e.push(n + ': start must be 0 or more.');
    if (b && okL && u.b > L + TOL) e.push(n + ': end must not exceed the span.');
  });
  return e;
}

function design(st) {
  const shape = SHAPES.find(s => s.name === st.shape);
  const L = st.span, Fy = st.fy;
  const pts = st.points.map(p => ({ x: p.x, P: p.P, type: p.type }));
  const uni = st.uniforms.map(u => ({ a: u.a, b: u.b, w: u.w, type: u.type }));
  const selfW = st.selfWeight ? shape.w / 1000 : 0; // kip/ft
  const withSelf = uni.concat(selfW ? [{ a: 0, b: L, w: selfW, type: 'D' }] : []);

  const total = analyze(st.support, L, pts, withSelf);
  const live = analyze(st.support, L, pts.filter(p => p.type === 'L'), uni.filter(u => u.type === 'L'));

  const Mabs = Math.abs(total.mmax.v), Vabs = Math.abs(total.vmax.v);
  const fb = Mabs * 12 / shape.Sx, Fb = 0.66 * Fy;
  const fv = Vabs / (shape.d * shape.tw), Fv = 0.4 * Fy;
  const Leff = (st.support === 'cantilever' ? 2 * L : L) * 12; // in
  const limit = Leff / st.limitDen;
  const dLive = live.maxDefl(E_STEEL, shape.Ix);
  const dTotal = total.maxDefl(E_STEEL, shape.Ix);
  const checks = {
    bending: { demand: fb, allow: Fb, ratio: fb / Fb },
    shear: { demand: fv, allow: Fv, ratio: fv / Fv },
    deflection: { demand: dLive.v, allow: limit, ratio: dLive.v / limit }
  };
  for (const k in checks) checks[k].pass = checks[k].ratio <= 1 + 1e-9;
  return { shape, L, Fy, total, live, selfW, Mabs, Vabs, fb, Fb, fv, Fv, Leff, limit, dLive, dTotal, checks,
    pass: Object.values(checks).every(c => c.pass) };
}
// ==== CORE END ====

  return s;
}

// To-scale W-shape cross-section (fillets ignored)
function sectionSvg(s) {
  const VW = 300, VH = 230, left = 56, right = 64, top = 14, bottom = 36;
  const sc = Math.min((VW - left - right) / s.bf, (VH - top - bottom) / s.d);
  const w = s.bf * sc, h = s.d * sc;
  const tf = Math.max(s.tf * sc, 1.5), tw = Math.max(s.tw * sc, 1.5);
  const cx = left + (VW - left - right) / 2, L = cx - w / 2, R = cx + w / 2;
  const T = top + (VH - top - bottom - h) / 2, B = T + h, mid = (T + B) / 2;
  const pts = [[L, T], [R, T], [R, T + tf], [cx + tw / 2, T + tf], [cx + tw / 2, B - tf], [R, B - tf], [R, B], [L, B], [L, B - tf], [cx - tw / 2, B - tf], [cx - tw / 2, T + tf], [L, T + tf]]
    .map(p => p[0].toFixed(2) + ',' + p[1].toFixed(2)).join(' ');
  const dx = L - 14, dy = B + 13;
  const t = (x, y, str, extra = '') => `<text x="${x}" y="${y}" font-size="11" fill="#1d2733" ${extra}>${str}</text>`;
  return `<svg viewBox="0 0 ${VW} ${VH}" role="img" aria-label="Cross-section of ${label(s.name)}" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <polygon points="${pts}" fill="#dbe5f1" stroke="#1f3a5f" stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="${L - 8}" x2="${R + 8}" y1="${mid}" y2="${mid}" stroke="#d6453d" stroke-width="1" stroke-dasharray="5 3"/>
    ${t(R + 10, mid - 4, 'x–x', 'fill="#d6453d" font-size="10"')}
    <g stroke="#64707d" stroke-width="1">
      <line x1="${dx}" x2="${dx}" y1="${T}" y2="${B}"/><line x1="${dx - 4}" x2="${dx + 4}" y1="${T}" y2="${T}"/><line x1="${dx - 4}" x2="${dx + 4}" y1="${B}" y2="${B}"/>
      <line x1="${L}" x2="${R}" y1="${dy}" y2="${dy}"/><line x1="${L}" x2="${L}" y1="${dy - 4}" y2="${dy + 4}"/><line x1="${R}" x2="${R}" y1="${dy - 4}" y2="${dy + 4}"/>
      <line x1="${cx + tw / 2}" x2="${R + 6}" y1="${mid + 14}" y2="${mid + 14}"/>
    </g>
    ${t(dx - 6, mid, `d = ${s.d}`, `text-anchor="middle" transform="rotate(-90 ${dx - 6} ${mid})"`)}
    ${t(cx, dy + 15, `b<tspan font-size="8" dy="2">f</tspan><tspan dy="-2"> = ${s.bf}</tspan>`, 'text-anchor="middle"')}
    ${t(R + 10, T + tf / 2 + 4, `t<tspan font-size="8" dy="2">f</tspan><tspan dy="-2"> = ${s.tf}</tspan>`)}
    ${t(R + 10, mid + 18, `t<tspan font-size="8" dy="2">w</tspan><tspan dy="-2"> = ${s.tw}</tspan>`)}
  </svg>`;
}

function renderProps() {
  const s = SHAPES.find(x => x.name === state.shape);
  if (!s) { $('props').innerHTML = ''; $('section').innerHTML = ''; return; }
  $('section').innerHTML = sectionSvg(s);
  const cell = (k, v) => `<div>${k}<b>${v}</b></div>`;
  $('props').innerHTML = cell('d (in)', s.d) + cell('t<sub>w</sub> (in)', s.tw) + cell('A (in²)', s.A) + cell('wt (plf)', s.w) +
    cell('I<sub>x</sub> (in⁴)', s.Ix) + cell('S<sub>x</sub> (in³)', s.Sx) + cell('b<sub>f</sub> (in)', s.bf) + cell('E (ksi)', E_STEEL.toLocaleString());
}

const typeSel = t => `<select data-f="type" aria-label="Load type"><option value="D"${t === 'D' ? ' selected' : ''}>Dead</option><option value="L"${t === 'L' ? ' selected' : ''}>Live</option></select>`;
const numIn = (f, v, lab) => `<input type="number" step="any" data-f="${f}" value="${nice(v)}" aria-label="${lab}">`;

function renderLists() {
  const P = $('points'), U = $('uniforms');
  P.innerHTML = state.points.length
    ? `<div class="lhead"><span>x (ft)</span><span>P (kip)</span><span>Type</span><span></span></div>` +
      state.points.map((p, i) => `<div class="lrow" data-list="points" data-i="${i}">${numIn('x', p.x, 'Position, ft')}${numIn('P', p.P, 'Load, kip')}${typeSel(p.type)}<button class="icon" type="button" data-del aria-label="Remove point load">×</button></div>`).join('')
    : '<p class="empty">No point loads.</p>';
  U.innerHTML = state.uniforms.length
    ? `<div class="lhead"><span>Start (ft)</span><span>End (ft)</span><span>w (kip/ft)</span><span>Type</span><span></span></div>` +
      state.uniforms.map((u, i) => `<div class="lrow" data-list="uniforms" data-i="${i}">${numIn('a', u.a, 'Start, ft')}${numIn('b', u.b, 'End, ft')}${numIn('w', u.w, 'Load, kip per ft')}${typeSel(u.type)}<button class="icon" type="button" data-del aria-label="Remove uniform load">×</button></div>`).join('')
    : '<p class="empty">No uniform loads.</p>';
}

function readForm() {
  const prevSpan = state.span;
  state.support = $('support').value;
  state.span = parseFloat($('span').value);
  state.shape = $('shape').value;
  state.grade = $('grade').value;
  if (state.grade !== 'custom') state.fy = GRADES[state.grade];
  else state.fy = parseFloat($('fy').value);
  state.selfWeight = $('selfw').checked;
  state.limitDen = parseFloat($('limit').value);
  if (Number.isFinite(state.span) && Number.isFinite(prevSpan) && state.span !== prevSpan) {
    let changed = false;
    for (const u of state.uniforms) if (Math.abs(u.b - prevSpan) < TOL) { u.b = state.span; changed = true; }
    if (changed) renderLists();
  }
}

function onFormInput(e) {
  readForm();
  if (e.target.id === 'grade') { $('fy').value = nice(state.fy); }
  $('fy').readOnly = state.grade !== 'custom';
  renderProps();
  update();
}

function onListInput(e) {
  const row = e.target.closest('[data-list]');
  if (!row || !e.target.dataset.f) return;
  const item = state[row.dataset.list][+row.dataset.i];
  const f = e.target.dataset.f;
  item[f] = f === 'type' ? e.target.value : parseFloat(e.target.value);
  update();
}
function onListClick(e) {
  if (!e.target.closest('[data-del]')) return;
  const row = e.target.closest('[data-list]');
  state[row.dataset.list].splice(+row.dataset.i, 1);
  renderLists();

}

// ---------- Results ----------
function update() {
  const errs = validate(state);
  const msg = $('messages'), res = $('results');
  if (errs.length) {
    msg.innerHTML = `<div class="errors"><b>Check the inputs</b><ul>${errs.map(x => `<li>${x}</li>`).join('')}</ul></div>`;
    res.style.display = 'none';
    last = null;
    return;
  }
  msg.innerHTML = '';
  res.style.display = '';
  last = design(state);
  renderSummary(last);
  renderChecks(last);
  renderNotes(last);
  drawChart();
}

function renderSummary(r) {
  const simple = state.support === 'simple';
  const s = r.shape;
  const mSign = r.total.mmax.v < 0 ? ' (hogging)' : '';
  const cards = [];
  cards.push(simple
    ? stat('Reactions', `${fmt(r.total.RA)} / ${fmt(r.total.RB)} kip`, 'Left / right support')
    : stat('Fixed-end reaction', `${fmt(r.total.RA)} kip`, `Fixed-end moment ${fmt(Math.abs(r.total.M0))} kip-ft`));
  cards.push(stat('Max shear', `${fmt(r.Vabs)} kip`, `at x = ${fmt(r.total.vmax.x)} ft`));
  cards.push(stat('Max moment', `${fmt(r.Mabs)} kip-ft`, `at x = ${fmt(r.total.mmax.x)} ft${mSign}`));
  cards.push(stat('Max deflection', `${fmt(r.dTotal.v, 3)} in`, `total load, at x = ${fmt(r.dTotal.x)} ft`));
  $('summary').innerHTML = cards.join('');
  $('summary').dataset.shape = s.name;
}
const stat = (k, v, n) => `<div class="card stat"><div class="k">${k}</div><div class="v">${v}</div><div class="n">${n}</div></div>`;

function renderChecks(r) {
  const c = r.checks, s = r.shape;
  const row = (name, demand, allow, unit, ratio, pass, formula) => {
    const pct = Math.min(ratio, 1.25) / 1.25 * 100;
    const col = !pass ? 'var(--bad)' : ratio > 0.9 ? 'var(--warn)' : 'var(--ok)';
    return `<tr><td><b>${name}</b><span class="f">${formula}</span></td>
      <td>${demand} ${unit}</td><td>${allow} ${unit}</td>
      <td style="min-width:120px"><div class="bar"><span style="width:${pct}%;background:${col}"></span></div><span class="f">${fmt(ratio, 2)}</span></td>
      <td><span class="badge ${pass ? 'pass' : 'fail'}">${pass ? 'PASS' : 'FAIL'}</span></td></tr>`;
  };
  const dl = state.support === 'cantilever' ? `2L/${nice(state.limitDen)}` : `L/${nice(state.limitDen)}`;
  const noLive = r.dLive.v === 0 ? ' No live load, so this check is trivially satisfied.' : '';
  $('checks').innerHTML = `<table>
    <thead><tr><th>Check</th><th>Demand</th><th>Allowable</th><th>Ratio</th><th></th></tr></thead><tbody>
    ${row('Bending', fmt(c.bending.demand), fmt(c.bending.allow), 'ksi', c.bending.ratio, c.bending.pass,
      `f<sub>b</sub> = M/S<sub>x</sub> = ${fmt(r.Mabs)} × 12 / ${s.Sx}; F<sub>b</sub> = 0.66 F<sub>y</sub>`)}
    ${row('Shear', fmt(c.shear.demand), fmt(c.shear.allow), 'ksi', c.shear.ratio, c.shear.pass,
      `f<sub>v</sub> = V/(d·t<sub>w</sub>) = ${fmt(r.Vabs)} / (${s.d} × ${s.tw}); F<sub>v</sub> = 0.4 F<sub>y</sub>`)}
    ${row('Deflection (live load)', fmt(c.deflection.demand, 3), fmt(c.deflection.allow, 3), 'in', c.deflection.ratio, c.deflection.pass,
      `Δ<sub>LL</sub> at x = ${fmt(r.dLive.x)} ft against ${dl}.${noLive}`)}
    </tbody></table>`;
  const failed = [];
  if (!c.bending.pass) failed.push('bending');
  if (!c.shear.pass) failed.push('shear');
  if (!c.deflection.pass) failed.push('deflection');
  $('messages').innerHTML = r.pass
    ? `<div class="verdict pass">✔ ${label(s.name)} (${state.grade === 'custom' ? 'Fy ' + nice(r.Fy) + ' ksi' : state.grade}) passes bending, shear and deflection.</div>`
    : `<div class="verdict fail">✖ ${label(s.name)} fails: ${failed.join(', ')}.</div>`;
}

function renderNotes(r) {
  $('notes').innerHTML = `<h2>Basis and assumptions</h2><ul>
    <li>Allowable stress design. Bending and shear use total (dead + live${r.selfW ? ' + self-weight ' + fmt(r.selfW, 3) + ' kip/ft' : ''}) load; deflection uses live load only.</li>
    <li>Beam is fully laterally braced and the section is compact. Buckling is not checked.</li>
    <li>E = 29,000 ksi. F<sub>b</sub> = 0.66 F<sub>y</sub>, F<sub>v</sub> = 0.4 F<sub>y</sub>. For cantilevers the deflection limit uses L = 2 × cantilever length.</li>
    <li>Sign convention: shear positive upward on the left face; moment positive when sagging; deflection shown downward.</li>
    <li>Educational tool. Not for design of record; verify with a licensed engineer.</li></ul>`;
}

// ---------- Chart ----------
function niceStep(range, target = 8) {
  const raw = range / target, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
}
const COL = { D: '#5b6b82', L: '#e0832a' };

function drawChart() {
  const el = $('chart');
  if (!last) { el.innerHTML = ''; return; }
  const r = last, L = r.L, s = r.shape;
  const W = Math.max(300, Math.floor(el.clientWidth || 640));
  const mL = 58, mR = 24, pw = W - mL - mR;
  const X = ft => mL + ft / L * pw;
  const hBeam = 160, hD = 132, gap = 10, hAx = 36;
  const yBeam = 4, yV = yBeam + hBeam + gap, yM = yV + hD + gap, yD = yM + hD + gap;
  const H = yD + hD + hAx;
  const S = r.total.series(E_STEEL, s.Ix);
  const out = [];

  out.push(`<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#5b6b82" stroke-width="1.5"/></pattern></defs>`);

  // grid + x axis
  const step = niceStep(L, Math.max(4, Math.floor(pw / 80)));
  let axis = '';
  for (let t = 0; t <= L + 1e-9; t += step) {
    const x = X(t);
    out.push(`<line x1="${x}" x2="${x}" y1="${yV}" y2="${yD + hD}" stroke="#e6eaf0" stroke-width="1"/>`);
    axis += `<line x1="${x}" x2="${x}" y1="${yD + hD}" y2="${yD + hD + 5}" stroke="#8a95a3"/><text x="${x}" y="${yD + hD + 18}" text-anchor="middle" font-size="11" fill="#64707d">${nice(t)}</text>`;
  }
  out.push(`<line x1="${mL}" x2="${mL + pw}" y1="${yD + hD}" y2="${yD + hD}" stroke="#8a95a3"/>` + axis +
    `<text x="${mL + pw / 2}" y="${yD + hD + 33}" text-anchor="middle" font-size="11" fill="#64707d">Distance along beam x (ft)</text>`);

  out.push(beamSketch(r, X, yBeam, hBeam, mL, pw));

  const dV = diagram(yV, hD, S.V.x, S.V.y, X, '#178a8a', 'Shear V (kip)', 2, false, mL, pw);
  const dM = diagram(yM, hD, S.X, S.M, X, '#2f6fb3', 'Moment M (kip-ft)', 2, false, mL, pw);
  const dD = diagram(yD, hD, S.X, S.D, X, '#7e57c2', 'Deflection δ (in, downward)', 3, true, mL, pw);
  out.push(dV.svg, dM.svg, dD.svg);

  out.push(`<line id="hvLine" y1="${yV}" y2="${yD + hD}" stroke="#1d2733" stroke-width="1" stroke-dasharray="4 3" style="display:none"/>
    <circle id="hvV" r="4" fill="#178a8a" stroke="#fff" stroke-width="1.5" style="display:none"/>
    <circle id="hvM" r="4" fill="#2f6fb3" stroke="#fff" stroke-width="1.5" style="display:none"/>
    <circle id="hvD" r="4" fill="#7e57c2" stroke="#fff" stroke-width="1.5" style="display:none"/>
    <rect id="hvArea" x="${mL}" y="${yBeam}" width="${pw}" height="${yD + hD - yBeam}" fill="transparent" style="cursor:crosshair"/>`);

  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Beam with loads and shear, moment and deflection diagrams" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">${out.join('')}</svg>`;

  const svg = el.firstChild, line = svg.querySelector('#hvLine'), area = svg.querySelector('#hvArea');
  const dots = { V: svg.querySelector('#hvV'), M: svg.querySelector('#hvM'), D: svg.querySelector('#hvD') };
  const idle = 'Hover or tap the diagrams to read V, M and δ at any point.';
  $('readout').textContent = idle;
  function move(ev) {
    const rect = svg.getBoundingClientRect();
    const px = Math.min(mL + pw, Math.max(mL, ev.clientX - rect.left));
    const ft = (px - mL) / pw * L;
    const v = r.total.V(ft, 1), m = r.total.M(ft), d = r.total.defl(ft, E_STEEL, s.Ix);
    line.setAttribute('x1', px); line.setAttribute('x2', px); line.style.display = '';
    for (const [k, val] of [['V', v], ['M', m], ['D', d]]) {
      const dg = { V: dV, M: dM, D: dD }[k];
      dots[k].setAttribute('cx', px); dots[k].setAttribute('cy', dg.y(val)); dots[k].style.display = '';
    }
    $('readout').innerHTML = `<b>x</b> ${fmt(ft)} ft &nbsp;·&nbsp; <b>V</b> ${fmt(v)} kip &nbsp;·&nbsp; <b>M</b> ${fmt(m)} kip-ft &nbsp;·&nbsp; <b>δ</b> ${fmt(d, 3)} in`;
  }
  function leave() {
    line.style.display = 'none';
    for (const k in dots) dots[k].style.display = 'none';
    $('readout').textContent = idle;
  }
  area.addEventListener('pointermove', move);
  area.addEventListener('pointerdown', move);
  area.addEventListener('pointerleave', leave);
}

function diagram(y0, h, xs, ys, X, color, title, dec, down, mL, pw) {
  let lo = Math.min(0, ...ys), hi = Math.max(0, ...ys);
  if (hi - lo < 1e-12) { hi = 1; lo = -1; }
  const top = y0 + 30, bot = y0 + h - 20;
  const Y = v => (down ? top + (v - lo) / (hi - lo) * (bot - top) : bot - (v - lo) / (hi - lo) * (bot - top));
  const zero = Y(0);
  const pts = xs.map((x, i) => `${X(x).toFixed(2)},${Y(ys[i]).toFixed(2)}`);
  const first = X(xs[0]).toFixed(2), lastx = X(xs[xs.length - 1]).toFixed(2);
  let svg = `<rect x="${mL}" y="${y0}" width="${pw}" height="${h}" fill="#fbfcfd" stroke="#e6eaf0"/>
    <polygon points="${first},${zero} ${pts.join(' ')} ${lastx},${zero}" fill="${color}" fill-opacity="0.14"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
    <line x1="${mL}" x2="${mL + pw}" y1="${zero}" y2="${zero}" stroke="#8a95a3"/>
    <text x="${mL - 6}" y="${zero + 4}" text-anchor="end" font-size="11" fill="#64707d">0</text>
    <text x="${mL + 8}" y="${y0 + 15}" font-size="12" font-weight="600" fill="${color}">${title}</text>`;
  const imax = ys.indexOf(Math.max(...ys)), imin = ys.indexOf(Math.min(...ys));
  const tag = (i, above) => {
    const v = ys[i];
    if (Math.abs(v) < 1e-9) return '';
    const px = X(xs[i]), anchor = px < mL + 34 ? 'start' : px > mL + pw - 34 ? 'end' : 'middle';
    const ty = above ? Y(v) - 7 : Y(v) + 15;
    return `<circle cx="${px}" cy="${Y(v)}" r="3" fill="${color}"/><text x="${px}" y="${ty}" text-anchor="${anchor}" font-size="11" font-weight="600" fill="#1d2733">${fmt(v, dec)}</text>`;
  };
  if (down) { svg += tag(imax, false); if (lo < -1e-9) svg += tag(imin, true); }
  else { svg += tag(imax, true); if (lo < -1e-9) svg += tag(imin, false); }
  return { svg, y: Y };
}

function beamSketch(r, X, y0, h, mL, pw) {
  const L = r.L, simple = state.support === 'simple';
  const bt = y0 + 108, bb = bt + 9; // beam top/bottom
  let g = `<rect x="${X(0)}" y="${bt}" width="${X(L) - X(0)}" height="9" rx="1.5" fill="#1f3a5f"/>`;
  const arrow = (x, yTop, yBot, c) => `<line x1="${x}" x2="${x}" y1="${yTop}" y2="${yBot - 6}" stroke="${c}" stroke-width="2"/><polygon points="${x},${yBot} ${x - 4.5},${yBot - 9} ${x + 4.5},${yBot - 9}" fill="${c}"/>`;
  const txt = (x, y, t, c, anchor = 'middle') => `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="11" font-weight="600" fill="${c}">${t}</text>`;

  for (const u of state.uniforms) {
    if (!(u.w > 0)) continue;
    const c = COL[u.type], xa = X(u.a), xb = X(u.b), ty = y0 + 66;
    g += `<rect x="${xa}" y="${ty}" width="${xb - xa}" height="${bt - ty}" fill="${c}" fill-opacity="0.10"/><line x1="${xa}" x2="${xb}" y1="${ty}" y2="${ty}" stroke="${c}" stroke-width="2"/>`;
    const n = Math.max(1, Math.round((xb - xa) / 24));
    for (let i = 0; i <= n; i++) g += arrow(xa + (xb - xa) * i / n, ty, bt - 1, c);
    g += txt((xa + xb) / 2, ty - 6, `${nice(u.w)} kip/ft`, c);
  }
  for (const p of state.points) {
    if (!(p.P > 0)) continue;
    const c = COL[p.type], x = X(p.x);
    g += arrow(x, y0 + 24, bt - 1, c) + txt(Math.min(Math.max(x, mL + 24), mL + pw - 24), y0 + 17, `${nice(p.P)} kip`, c);
  }
  if (simple) {
    const tri = x => `<polygon points="${x},${bb} ${x - 9},${bb + 15} ${x + 9},${bb + 15}" fill="#fff" stroke="#1f3a5f" stroke-width="2"/>`;
    g += tri(X(0)) + tri(X(L));
    g += `<circle cx="${X(L)}" cy="${bb + 20}" r="4.5" fill="#fff" stroke="#1f3a5f" stroke-width="2"/>`;
    g += `<line x1="${X(0) - 14}" x2="${X(0) + 14}" y1="${bb + 15}" y2="${bb + 15}" stroke="#1f3a5f" stroke-width="2"/>`;
    g += txt(X(0), bb + 36, `R = ${fmt(r.total.RA)} kip`, '#1d2733', 'start');
    g += txt(X(L), bb + 36, `R = ${fmt(r.total.RB)} kip`, '#1d2733', 'end');
  } else {
    g += `<rect x="${X(0) - 12}" y="${bt - 26}" width="12" height="${h - 90}" fill="url(#hatch)" stroke="#5b6b82"/>`;
    g += txt(X(0) + 4, bb + 36, `R = ${fmt(r.total.RA)} kip, M = ${fmt(Math.abs(r.total.M0))} kip-ft`, '#1d2733', 'start');
  }
  return g;
}

// ---------- Init ----------
function init() {
  fillShapes();
  renderLists();
  syncForm();
  ['support', 'span', 'shape', 'grade', 'fy', 'selfw', 'limit'].forEach(id => {
    $(id).addEventListener('input', onFormInput);
    $(id).addEventListener('change', onFormInput);
  });
  for (const id of ['points', 'uniforms']) {
    $(id).addEventListener('input', onListInput);
    $(id).addEventListener('change', onListInput);
    $(id).addEventListener('click', onListClick);
  }
  $('addPoint').addEventListener('click', () => {
    const L = Number.isFinite(state.span) ? state.span : 10;
    state.points.push({ x: +(L / 2).toFixed(3), P: 5, type: 'L' });
    renderLists(); update();
  });
  $('addUniform').addEventListener('click', () => {
    const L = Number.isFinite(state.span) ? state.span : 10;
    state.uniforms.push({ a: 0, b: L, w: 0.5, type: 'D' });
    renderLists(); update();
  });
  $('reset').addEventListener('click', () => { state = EXAMPLE(); renderLists(); syncForm(); update(); });
  if (window.ResizeObserver) new ResizeObserver(() => { if (last) drawChart(); }).observe($('chart'));
  else window.addEventListener('resize', () => { if (last) drawChart(); });
  update();
}
if (typeof document !== 'undefined') init();
</script>
</body>
</html>
